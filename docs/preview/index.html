<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloudy — Wake Word & Clap Activation</title>
    <meta
      name="description"
      content="Cloudy stays asleep until awakened by Hey Cloudy or a clap."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600&family=Rajdhani:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="boot">
    <div id="bloom" aria-hidden="true"></div>
    <canvas id="fx" aria-hidden="true"></canvas>

    <div class="gate" id="gate">
      <p class="gate-brand">Cloudy</p>
      <p class="gate-copy">
        Enable the microphone to idle in sleep mode.<br />
        Wake with <strong>Hey Cloudy</strong> or a <strong>clap</strong>.
      </p>
      <button type="button" id="enableBtn" class="gate-btn">Enable listening</button>
      <p class="gate-note" id="gateNote"></p>
    </div>

    <main class="stage" id="stage" hidden>
      <div class="zoom-layer" id="zoomLayer">
        <div class="orb-wrap" id="orbWrap">
          <div class="orb-rings" id="orbRings" aria-hidden="true"></div>
          <div class="orb" id="orb">
            <div class="orb-core"></div>
            <div class="orb-sheen"></div>
          </div>
        </div>

        <svg class="neural" id="neural" viewBox="0 0 1000 600" aria-hidden="true"></svg>

        <div class="hud" id="hud">
          <header class="hud-top">
            <span class="hud-brand">Cloudy</span>
            <span class="hud-chip" id="modeChip">SLEEP</span>
          </header>

          <div class="hud-panel left" id="panelLeft">
            <p class="panel-label">Sensors</p>
            <ul>
              <li>Wake phrase · Hey Cloudy</li>
              <li>Clap · single / double</li>
              <li id="micLevelLabel">Mic energy · 0%</li>
            </ul>
          </div>

          <div class="hud-panel right" id="panelRight">
            <p class="panel-label">Activity</p>
            <ul id="activityLog"></ul>
          </div>

          <div class="hud-bottom" id="panelBottom">
            <canvas id="wave" width="640" height="56" aria-hidden="true"></canvas>
            <p class="transcript" id="transcript"></p>
          </div>
        </div>
      </div>

      <p class="sleep-status" id="sleepStatus">
        <span class="dot"></span>
        Sleeping · Listening for “Hey Cloudy” or Clap
      </p>
    </main>

    <script src="./main.js" type="module"></script>
  </body>
</html>
